<h2 class="login-title">Connexion</h2>
<form (ngSubmit)="onSubmit()" class="login-form">
  <div class="form-group">
    <label for="login">Identifiant</label>
    <input id="login" type="text" [(ngModel)]="login" name="login" placeholder="Identifiant" autocomplete="username" />
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Mot de passe" autocomplete="current-password" />
  </div>
  <button type="submit" class="btn-submit" [disabled]="loading">
    {{ loading ? 'Connexion…' : 'Se connecter' }}
  </button>
</form>
